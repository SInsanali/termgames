[project]
name = "termgames"
version = "0.1.0"
description = "A small collection of terminal games that share one control scheme."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=0.60",
]

[project.scripts]
termgames = "termgames.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["termgames*"]
